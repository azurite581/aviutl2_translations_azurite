name: Release

run-name: Release
on:
  push:
    tags:
      - "r*"

env:
  AUTHOR: azurite

jobs:
  release:
    name: Release
    runs-on: windows-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set package version
      run: |
        $path = "./package.ini"
        $content = Get-Content $path -Raw
        $content = $content.Replace('${VERSION}', $env:VERSION)
        Set-Content $path $content -NoNewline
      env:
        VERSION: ${{ github.ref_name }}

    - name: Merge into a single language file
      run: |
        .\tools\merge.ps1 -input_dir ".\Translations\English" -output ".\out\English.${env:AUTHOR}.aul2"
        .\tools\merge.ps1 -input_dir ".\Translations\简体中文" -output ".\out\简体中文.${env:AUTHOR}.aul2"

    - name: Create zip file
      run: |
        New-Item -ItemType Directory -Path ".\out\package\Language" -Force | Out-Null
        Copy-Item ".\package.ini" ".\out\package\" -Force
        Copy-Item ".\out\English.${env:AUTHOR}.aul2" ".\out\package\Language\" -Force
        Copy-Item ".\out\简体中文.${env:AUTHOR}.aul2" ".\out\package\Language\" -Force
        Compress-Archive -Path ".\out\package\*" -DestinationPath ".\out\aviutl2_translations_${env:AUTHOR}_${env:VERSION}.au2pkg.zip" -Force
        Remove-Item ".\out\package" -Recurse -Force
      env:
        VERSION: ${{ github.ref_name }}

    - name: Create release notes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $ok = $false
        foreach ($i in 1..3) {
          dotnet restore .\tools\ChangelogExtract.cs -v:n
          if ($LASTEXITCODE -eq 0) { $ok = $true; break }
          Start-Sleep -Seconds (5 * $i)
        }
        if (-not $ok) { throw "dotnet restore failed" }

        dotnet .\tools\ChangelogExtract.cs -- .\CHANGELOG.md .\EXTRACTED.md --semver "$env:VERSION"
        if ($LASTEXITCODE -ne 0) { throw "ChangelogExtract failed" }
        if (-not (Test-Path .\EXTRACTED.md)) { throw "EXTRACTED.md was not generated" }

        gh release create "$env:VERSION" --notes-file EXTRACTED.md ".\out\*_${env:VERSION}.au2pkg.zip"
      env:
        VERSION: ${{ github.ref_name }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
